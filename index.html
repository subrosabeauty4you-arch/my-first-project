<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subrosa Beauty — Our Story</title>
  <meta name="description" content="Subrosa Beauty — a vegan, cruelty-free lip gloss brand. Our story, under the rose." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />

  <script>
    const SUBROSA_BASE = "./";
    const SUBROSA_PAGE = "story";
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "./assets/vendor/three/three.module.js",
        "three/addons/": "./assets/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="logo" href="./" id="logo-link">
        <img class="logo__img" id="logo-img" alt="Subrosa Beauty logo" />
        <span class="logo__text" id="logo-text"></span>
      </a>
      <nav class="nav__links" id="nav-links"></nav>
      <a class="nav__cta" id="nav-cta" href="shades/"></a>
      <button class="nav__burger" id="nav-burger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav__mobile" id="nav-mobile"></nav>
  </header>

  <!-- ============ HERO / 3D ============ -->
  <section class="hero" id="top">
    <div class="hero__decor" aria-hidden="true">
      <span class="floaty floaty--1"></span>
      <span class="floaty floaty--2"></span>
      <span class="floaty floaty--3"></span>
    </div>

    <div class="hero__scene" id="hero-scene">
      <canvas id="gloss-canvas"></canvas>
      <div class="hero__hint">drag to rotate</div>
    </div>

    <div class="hero__copy" id="hero-copy">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 class="headline" id="hero-headline"></h1>
      <p class="subheadline" id="hero-tagline"></p>
      <div class="hero__actions">
        <a class="btn btn--primary" id="hero-cta-primary" href="shades/"></a>
        <a class="btn btn--ghost" id="hero-cta-secondary" href="#narrative"></a>
      </div>
    </div>

    <div class="hero__scroll" aria-hidden="true"><span></span></div>
  </section>

  <!-- ============ NARRATIVE ============ -->
  <section class="narrative" id="narrative">
    <div class="section__inner narrative__inner">
      <p class="eyebrow reveal" id="narrative-eyebrow"></p>
      <h2 class="section__heading reveal" id="narrative-heading"></h2>
      <div class="narrative__body reveal" id="narrative-body"></div>
    </div>
  </section>

  <!-- ============ FOUNDER ============ -->
  <section class="founder">
    <div class="section__inner founder__inner">
      <div class="founder__photo-wrap reveal">
        <img id="founder-photo" alt="Subrosa Beauty founder" />
      </div>
      <div class="founder__copy reveal">
        <p class="eyebrow" id="founder-eyebrow"></p>
        <h2 id="founder-name"></h2>
        <p class="founder__title" id="founder-title"></p>
        <p class="founder__quote" id="founder-quote"></p>
        <p class="founder__bio" id="founder-bio"></p>
      </div>
    </div>
  </section>

  <!-- ============ VALUES ============ -->
  <section class="values">
    <div class="section__inner">
      <p class="eyebrow reveal" id="values-eyebrow" style="text-align:center"></p>
      <h2 class="section__heading reveal" id="values-heading"></h2>
      <div class="value-grid" id="values-grid"></div>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p id="footer-note"></p>
    <p><a id="footer-email" href="#"></a></p>
    <div class="footer__social" id="footer-social"></div>
  </footer>

  <script src="assets/vendor/gsap/gsap.min.js"></script>
  <script src="assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/chrome.js"></script>
  <script src="assets/js/content-story.js"></script>
  <script type="module" src="assets/js/scene-hero.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
