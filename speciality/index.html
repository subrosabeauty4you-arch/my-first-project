<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subrosa Beauty — Speciality</title>
  <meta name="description" content="The vegan formula behind Subrosa Beauty's gloss — ingredients, free-from claims, and the application ritual." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../assets/css/style.css" />

  <script>
    const SUBROSA_BASE = "../";
    const SUBROSA_PAGE = "speciality";
  </script>
</head>
<body>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="logo" href="../" id="logo-link">
        <img class="logo__img" id="logo-img" alt="Subrosa Beauty logo" />
        <span class="logo__text" id="logo-text"></span>
      </a>
      <nav class="nav__links" id="nav-links"></nav>
      <a class="nav__cta" id="nav-cta" href="../shades/"></a>
      <button class="nav__burger" id="nav-burger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="nav__mobile" id="nav-mobile"></nav>
  </header>

  <!-- ============ PAGE HEADER ============ -->
  <section class="page-header">
    <p class="eyebrow" id="speciality-eyebrow"></p>
    <h1 id="speciality-heading"></h1>
    <p id="speciality-intro"></p>
  </section>

  <!-- ============ INGREDIENTS ============ -->
  <section class="ingredients-section">
    <div class="section__inner">
      <div class="ingredient-grid" id="ingredients-grid"></div>
    </div>
  </section>

  <!-- ============ FREE FROM ============ -->
  <section class="free-from">
    <div class="section__inner free-from__inner">
      <p class="eyebrow reveal">Free From</p>
      <h2 class="section__heading reveal">What's Never In It</h2>
      <ul class="free-from-list" id="free-from-list"></ul>
    </div>
  </section>

  <!-- ============ APPLICATION RITUAL ============ -->
  <section class="ritual">
    <div class="section__inner ritual__inner">
      <p class="eyebrow reveal" style="text-align:center">Application</p>
      <h2 class="section__heading reveal">The Ritual</h2>
      <ul class="ritual-list" id="ritual-list"></ul>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p id="footer-note"></p>
    <p><a id="footer-email" href="#"></a></p>
    <div class="footer__social" id="footer-social"></div>
  </footer>

  <script src="../assets/vendor/gsap/gsap.min.js"></script>
  <script src="../assets/vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/chrome.js"></script>
  <script src="../assets/js/content-speciality.js"></script>
  <script src="../assets/js/animations.js"></script>
</body>
</html>
