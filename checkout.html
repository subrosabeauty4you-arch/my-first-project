<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Nimbus</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">◈</span> Nimbus</a>
      <div style="flex:1"></div>
      <span style="color:var(--text-soft); font-size:0.9rem;">🔒 Secure checkout</span>
    </div>
  </header>

  <main class="container checkout-wrap" id="checkout-main">
    <a href="index.html" class="checkout-back">← Continue shopping</a>
    <h1 style="font-size:1.9rem; letter-spacing:-0.02em; margin-bottom:8px;">Checkout</h1>

    <div class="checkout-grid" id="checkout-grid">
      <!-- Form -->
      <form class="checkout-form" id="checkout-form" novalidate>
        <h2>Contact</h2>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com" />
        </div>

        <h2>Shipping address</h2>
        <div class="field-row">
          <div class="field">
            <label for="firstName">First name</label>
            <input type="text" id="firstName" name="firstName" required />
          </div>
          <div class="field">
            <label for="lastName">Last name</label>
            <input type="text" id="lastName" name="lastName" required />
          </div>
        </div>
        <div class="field">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" required placeholder="123 Main St" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required />
          </div>
          <div class="field">
            <label for="zip">ZIP / Postal code</label>
            <input type="text" id="zip" name="zip" required />
          </div>
        </div>
        <div class="field">
          <label for="country">Country</label>
          <select id="country" name="country" required>
            <option value="">Select…</option>
            <option>United States</option>
            <option>Canada</option>
            <option>United Kingdom</option>
            <option>Australia</option>
            <option>Germany</option>
            <option>India</option>
            <option>Other</option>
          </select>
        </div>

        <h2>Payment</h2>
        <p style="color:var(--text-soft); font-size:0.85rem; margin:-6px 0 16px;">
          Demo only — do not enter real card details. No data is sent anywhere.
        </p>
        <div class="field">
          <label for="card">Card number</label>
          <input type="text" id="card" name="card" required placeholder="4242 4242 4242 4242" inputmode="numeric" maxlength="19" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="expiry">Expiry (MM/YY)</label>
            <input type="text" id="expiry" name="expiry" required placeholder="12/28" maxlength="5" />
          </div>
          <div class="field">
            <label for="cvc">CVC</label>
            <input type="text" id="cvc" name="cvc" required placeholder="123" maxlength="4" inputmode="numeric" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top:12px;">
          Place order
        </button>
      </form>

      <!-- Order summary -->
      <aside class="order-summary">
        <h2>Order summary</h2>
        <div class="summary-items" id="summary-items"></div>
        <div class="summary-line"><span>Subtotal</span><span id="sum-subtotal">$0.00</span></div>
        <div class="summary-line"><span>Shipping</span><span id="sum-shipping">$0.00</span></div>
        <div class="summary-line"><span>Tax (8%)</span><span id="sum-tax">$0.00</span></div>
        <div class="summary-line total"><span>Total</span><span id="sum-total">$0.00</span></div>
      </aside>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
